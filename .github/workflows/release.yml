name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  run_amd64:
    runs-on: ubuntu-22.04
    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install essential dependencies including protobuf-compiler and dbus
      - name: Install essential dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl build-essential musl-tools musl-dev pkg-config protobuf-compiler

      # Step 3: Install Rust toolchain
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Step 4: Add musl target for static linking
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      # Step 5: Build binary for AMD64 release
      - name: Build binary (AMD64 static)
        run: |
          echo "Building static binary for AMD64..."
          cd rocksdb-test
          cargo build --release --target x86_64-unknown-linux-musl
          cd ..
          mkdir -p dist/binaries/amd/
          cp rocksdb-test/target/x86_64-unknown-linux-musl/release/rocksdb-client dist/binaries/amd/rocksctl-linux-amd64
          ls -la dist/binaries/amd/
          file dist/binaries/amd/rocksctl-linux-amd64
      # Step 6: Upload AMD64 binary
      - name: Upload binary (AMD64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocksctl-binary-amd64
          path: dist/binaries/amd/rocksctl-linux-amd64
  run_arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install essential dependencies including protobuf-compiler and dbus
      - name: Install essential dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl build-essential musl-tools musl-dev pkg-config protobuf-compiler

      # Step 3: Install Rust toolchain
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Step 4: Add musl target for static linking
      - name: Add musl target
        run: rustup target add aarch64-unknown-linux-musl

      # Step 5: Build binary for ARM64 release
      - name: Build binary (ARM64 static)
        run: |
          echo "Building static binary for ARM64..."
          cd rocksdb-test
          cargo build --release --target aarch64-unknown-linux-musl
          cd ..
          mkdir -p dist/binaries/arm/
          cp rocksdb-test/target/aarch64-unknown-linux-musl/release/rocksdb-client dist/binaries/arm/rocksctl-linux-arm64
          ls -la dist/binaries/arm/
          file dist/binaries/arm/rocksctl-linux-arm64
      # Step 6: Upload ARM64 binary
      - name: Upload binary (ARM64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocksctl-binary-arm64
          path: dist/binaries/arm/rocksctl-linux-arm64
  upload_binary:
    name: Upload release artifacts
    runs-on: ubuntu-latest

    # Only run this if triggered by a version tag push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    # Wait for all required jobs to complete successfully
    needs:
      - run_arm64
      - run_amd64

    permissions: write-all
    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download binary - amd64
      - name: Download binary - amd64
        uses: actions/download-artifact@v4
        with:
          name: rocksctl-binary-amd64
          path: dist/binaries/amd

      # Download binary - arm64
      - name: Download binary - arm64
        uses: actions/download-artifact@v4
        with:
          name: rocksctl-binary-arm64
          path: dist/binaries/arm
