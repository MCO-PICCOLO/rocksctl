apiVersion: v1
kind: TestScenario
metadata:
  name: rocksdb-helloworld-test
spec:
  description: "RocksDB operations test with helloworld YAML content"
  server:
    url: "http://127.0.0.1:47007"
  tests:
    - name: "PUT helloworld YAML"
      action: "put"
      key: "helloworld"
      value: |
        apiVersion: v1
        kind: Scenario
        metadata:
          name: helloworld
        spec:
          condition: null
          action: update
          target: helloworld
        ---
        apiVersion: v1
        kind: Package
        metadata:
          label: null
          name: helloworld
        spec:
          pattern:
            - type: plain
          models:
            - name: helloworld
              node: HPC
              resources:
                volume:
                network:
        ---
        apiVersion: v1
        kind: Model
        metadata:
          name: helloworld
          annotations:
            io.piccolo.annotations.package-type: helloworld
            io.piccolo.annotations.package-name: helloworld
            io.piccolo.annotations.package-network: default
          labels:
            app: helloworld
        spec:
          hostNetwork: true
          containers:
            - name: helloworld
              image: quay.io/podman/hello:latest
          terminationGracePeriodSeconds: 0
          restartPolicy: Always
      expect: "success"
    - name: "GET helloworld YAML"
      action: "get"
      key: "helloworld"
      expect: "success"
      expected_value: |
        apiVersion: v1
        kind: Scenario
        metadata:
          name: helloworld
        spec:
          condition: null
          action: update
          target: helloworld
        ---
        apiVersion: v1
        kind: Package
        metadata:
          label: null
          name: helloworld
        spec:
          pattern:
            - type: plain
          models:
            - name: helloworld
              node: HPC
              resources:
                volume:
                network:
        ---
        apiVersion: v1
        kind: Model
        metadata:
          name: helloworld
          annotations:
            io.piccolo.annotations.package-type: helloworld
            io.piccolo.annotations.package-name: helloworld
            io.piccolo.annotations.package-network: default
          labels:
            app: helloworld
        spec:
          hostNetwork: true
          containers:
            - name: helloworld
              image: quay.io/podman/hello:latest
          terminationGracePeriodSeconds: 0
          restartPolicy: Always
    - name: "PUT additional test data for prefix"
      action: "put"
      key: "hello:world"
      value: "Hello World test data"
      expect: "success"
    - name: "PUT additional test data for prefix"
      action: "put"
      key: "hello:universe"
      value: "Hello Universe test data"
      expect: "success"
    - name: "GET-PREFIX hello"
      action: "get-prefix"
      key: "hello"
      expect: "success"
    - name: "GET-PREFIX helloworld (exact match)"
      action: "get-prefix"
      key: "helloworld"
      expect: "success"
    - name: "GET-PREFIX nonexistent"
      action: "get-prefix"
      key: "nonexistent"
      expect: "success"
    - name: "DELETE helloworld"
      action: "delete"
      key: "helloworld"
      expect: "success"
    - name: "GET deleted helloworld (should fail)"
      action: "get"
      key: "helloworld"
      expect: "failure"
      expected_error: "Key not found"
    - name: "Cleanup additional test data"
      action: "delete"
      key: "hello:world"
      expect: "success"
    - name: "Cleanup additional test data"
      action: "delete"
      key: "hello:universe"
      expect: "success"
      expect: "success"